<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata – Circolandia</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:"Lilita One";font-display:swap;src:url(/fonts/lilita-one-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-weight:800;font-display:swap;src:url(/fonts/nunito-latin-800-normal.woff2) format("woff2")}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;text-align:center;color:#fff;font:800 18px/1.5 Nunito,system-ui,sans-serif;
  background:repeating-linear-gradient(100deg,#E2312B 0 70px,#F04A3F 70px 140px);padding:24px max(16px,env(safe-area-inset-left,0px))}
h1{font-family:"Lilita One",system-ui,sans-serif;font-weight:400;font-size:clamp(4rem,18vw,9rem);line-height:1;margin:0;color:#FFC531;text-shadow:0 6px 0 #A81E1A}
p{margin:10px 0 26px;font-size:1.2rem}
a{display:inline-block;background:#FFC531;color:#2A1F2D;text-decoration:none;font-family:"Lilita One",system-ui,sans-serif;font-size:1.3rem;padding:14px 26px;border-radius:16px;box-shadow:0 5px 0 #C9900F}
</style>
</head>
<body>
<div>
  <h1>Ops!</h1>
  <p>Questo numero non è in programma: la pagina che cerchi non esiste.</p>
  <a href="/">Torna sotto il tendone</a>
</div>
</body>
</html>
